<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitr | Boutique Mohajabat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Sitr</h1>
    <nav class="nav">
      <a href="#accueil">Accueil</a>
      <a href="#collections">Collections</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="accueil">
    <h2>L'élégance de la pudeur</h2>
    <p>Abayas, hijabs et caftans pour chaque occasion</p>
    <a href="#collections" class="btn">Découvrir la collection</a>
  </section>

  <section class="collections" id="collections">
    <h2 class="section-title">Nos collections</h2>
    <div class="cards">
      <div class="card">
        <div class="card-img">Abayas</div>
        <h3>Abayas</h3>
      </div>
      <div class="card">
        <div class="card-img">Hijabs</div>
        <h3>Hijabs</h3>
      </div>
      <div class="card">
        <div class="card-img">Caftans</div>
        <h3>Caftans</h3>
      </div>
    </div>
  </section>
  <section class="collections" id="collections">
  <h2 class="section-title">Nos articles</h2>
  <div class="cards" id="produits"></div>
</section>

<div class="filtres">
  <button class="filtre actif" data-cat="Tous">Tous</button>
  <button class="filtre" data-cat="Abayas">Abayas</button>
  <button class="filtre" data-cat="Hijabs">Hijabs</button>
  <button class="filtre" data-cat="Caftans">Caftans</button>
</div>

  <footer class="footer" id="contact">
    <p>© 2026 Sitr. Tous droits réservés.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
