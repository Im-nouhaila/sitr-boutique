<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitr | Boutique Mohajabat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <nav class="nav-left">
      <a href="#accueil">Accueil</a>
      <a href="#collections">Articles</a>
    </nav>
    <h1 class="logo">Sitr</h1>
    <nav class="nav-right">
      <a href="#contact">Contact</a>
      <a href="#" class="panier">Panier (<span id="compteur">0</span>)</a>
    </nav>
  </header>

  <section class="hero" id="accueil">
    <div class="hero-contenu">
      <span class="sur-titre">Nouvelle collection</span>
      <h2>Le style qui vous ressemble</h2>
      <p>Abayas, hijabs et caftans, choisis avec soin</p>
      <a href="#collections" class="btn">Découvrir</a>
    </div>
  </section>

  <section class="collections" id="collections">
    <h2 class="section-title">Nos articles</h2>

    <div class="filtres">
      <button class="filtre actif" data-cat="Tous">Tous</button>
      <button class="filtre" data-cat="Abayas">Abayas</button>
      <button class="filtre" data-cat="Hijabs">Hijabs</button>
      <button class="filtre" data-cat="Caftans">Caftans</button>
    </div>

    <div class="cards" id="produits"></div>
  </section>

  <footer class="footer" id="contact">
    <p>© 2026 Sitr. Tous droits réservés.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
